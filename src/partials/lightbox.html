<!--
  Foto ampliada da galeria da frota. É um <dialog> (o navegador cuida do Esc
  e do foco). Quem preenche e abre é o arquivo src/js/lightbox.js.
-->
<dialog class="lightbox" aria-label="Foto ampliada" data-lightbox>
  <figure class="lightbox__figure">
    <img class="lightbox__image" src="data:," alt="" data-lightbox-image />
    <figcaption class="lightbox__caption" data-lightbox-caption></figcaption>
  </figure>

  <button class="lightbox__button lightbox__button--close" type="button" data-lightbox-close>
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
    </svg>
    <span class="visually-hidden">Fechar</span>
  </button>
  <button class="lightbox__button lightbox__button--prev" type="button" data-lightbox-prev>
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
      <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" />
    </svg>
    <span class="visually-hidden">Foto anterior</span>
  </button>
  <button class="lightbox__button lightbox__button--next" type="button" data-lightbox-next>
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
      <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" />
    </svg>
    <span class="visually-hidden">Próxima foto</span>
  </button>
</dialog>
