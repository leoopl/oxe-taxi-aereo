<!-- Fale com a OXE (contatos). -->
<section
  class="section section--tint has-ornament has-ornament--right"
  id="contato"
  aria-labelledby="contato-title"
>
  <div class="container" data-reveal>
    <h2 id="contato-title">Fale com a OXE</h2>
    <p class="lead">Conte seu destino e como deseja viajar. Respondemos com uma proposta personalizada.</p>

    <ul class="contact-list">
      <li>
        <strong>WhatsApp</strong>
        <a href="{{ whatsappUrl }}" target="_blank" rel="noopener">{{ phoneDisplay }}</a>
      </li>
      <li>
        <strong>Telefone</strong>
        <a href="tel:{{ phoneTel }}">{{ phoneDisplay }}</a>
      </li>
      <li>
        <strong>E-mail</strong>
        <a href="mailto:{{ email }}">{{ email }}</a>
      </li>
      <li>
        <strong>Instagram</strong>
        <a href="{{ instagramUrl }}" target="_blank" rel="noopener">{{ instagramHandle }}</a>
      </li>
    </ul>

    <a class="btn" href="{{ whatsappUrl }}" target="_blank" rel="noopener">Solicitar Cotação</a>
  </div>
</section>
