<!-- Rodapé com dados da empresa. -->
<footer class="site-footer">
  <div class="site-footer__inner container">
    <img
      class="site-footer__logo"
      src="/src/assets/images/logo-560.webp"
      srcset="/src/assets/images/logo-160.webp 160w, /src/assets/images/logo-560.webp 560w"
      sizes="108px"
      width="1071"
      height="1067"
      alt="OXE Táxi Aéreo"
      loading="lazy"
    />
    <div>
      <p>
        <b>{{ siteName }}</b>
        · Aviação executiva com atendimento personalizado.
      </p>
      <p>Razão social: {{ legalName }} · CNPJ {{ cnpj }}</p>
      <p>{{ addressLine }}</p>
      <p>WhatsApp: {{ phoneDisplay }} · {{ email }}</p>
      <p>
        ©
        <span data-current-year>{{ currentYear }}</span>
        {{ siteName }}. Todos os direitos reservados.
      </p>
    </div>
  </div>
</footer>
