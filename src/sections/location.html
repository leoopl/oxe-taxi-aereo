<!-- Onde estamos (local de embarque + link para o Google Maps). -->
<section
  class="section has-ornament has-ornament--left"
  id="onde-estamos"
  aria-labelledby="onde-estamos-title"
>
  <div class="container split" data-reveal>
    <div>
      <p class="eyebrow">Onde estamos</p>
      <h2 id="onde-estamos-title">Embarque no Aeroclube de Alagoas</h2>
      <p class="lead">
        Aeroclube de Alagoas, Maceió – AL
        <br />
        <small>Endereço da empresa: {{ addressLine }}</small>
      </p>
      <a class="btn btn--outline" href="{{ mapsUrl }}" target="_blank" rel="noopener">Abrir no Google Maps</a>
    </div>

    <!-- Desenho decorativo de "mapa" (ruas brancas sobre fundo azul/verde). -->
    <div class="map-card">
      <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <path
          d="M-10 190 C80 150 140 220 220 170 S360 120 420 160"
          stroke="#fff"
          stroke-width="14"
          fill="none"
        />
        <path d="M60 -10 C90 70 70 140 130 270" stroke="#fff" stroke-width="10" fill="none" />
        <path d="M250 -10 C260 60 320 100 300 270" stroke="#fff" stroke-width="10" fill="none" />
      </svg>
      <a class="btn" href="{{ mapsUrl }}" target="_blank" rel="noopener">Ver no mapa</a>
    </div>
  </div>
</section>
