<!--
  Formulário "Planeje seu voo". Ao enviar, abre o WhatsApp com a mensagem pronta.
  Validação e envio: src/js/quote-form.js
-->
<div class="quote">
  <div class="container">
    <form class="quote-form" id="quote-form" aria-labelledby="quote-form-title" data-quote-form>
      <div class="quote-form__header">
        <h2 class="quote-form__title" id="quote-form-title">Planeje seu voo</h2>
        <p class="quote-form__subtitle">Prepare o pedido e envie pelo WhatsApp.</p>
      </div>

      <div class="quote-form__fields">
        <div class="quote-form__field">
          <label for="quote-origin">Origem</label>
          <input id="quote-origin" name="origin" value="Maceió, AL" required autocomplete="off" />
          <p class="quote-form__error" id="quote-origin-error" hidden></p>
        </div>

        <div class="quote-form__field">
          <label for="quote-destination">Destino</label>
          <input
            id="quote-destination"
            name="destination"
            placeholder="Cidade ou aeroporto"
            required
            autocomplete="off"
          />
          <p class="quote-form__error" id="quote-destination-error" hidden></p>
        </div>

        <div class="quote-form__field">
          <label for="quote-date">Data</label>
          <input id="quote-date" name="date" type="date" />
          <p class="quote-form__error" id="quote-date-error" hidden></p>
        </div>

        <div class="quote-form__field">
          <label for="quote-passengers">Passageiros</label>
          <select id="quote-passengers" name="passengers" required>
            <option value="" disabled selected>Selecione</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
          </select>
          <p class="quote-form__error" id="quote-passengers-error" hidden></p>
        </div>

        <div class="quote-form__actions">
          <button class="btn quote-form__submit" type="submit">Solicitar Cotação</button>
        </div>
      </div>
    </form>
  </div>
</div>
