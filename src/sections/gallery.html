<!-- Galeria e Instagram -->
<section class="section has-ornament has-ornament--right" id="galeria" aria-labelledby="galeria-title">
  <div class="container" data-reveal>
    <p class="eyebrow">Galeria e Instagram</p>
    <h2 id="galeria-title">Acompanhe a OXE</h2>
    <p class="lead">Bastidores, destinos e novidades dos nossos voos.</p>

    <a
      class="instagram-icon"
      href="{{ instagramUrl }}"
      target="_blank"
      rel="noopener"
      aria-label="Instagram da OXE Táxi Aéreo"
    >
      <svg
        width="32"
        height="32"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <rect x="3" y="3" width="18" height="18" rx="5" />
        <circle cx="12" cy="12" r="4.2" />
        <circle cx="17.3" cy="6.7" r=".6" fill="currentColor" />
      </svg>
    </a>

    <div class="instagram-grid">
      <a class="instagram-grid__item" href="{{ instagramUrl }}" target="_blank" rel="noopener">
        <img
          src="/src/assets/images/instagram-sunset-640.webp"
          width="640"
          height="853"
          alt="Ver no Instagram: aeronave ao pôr do sol"
          loading="lazy"
        />
      </a>
      <a class="instagram-grid__item" href="{{ instagramUrl }}" target="_blank" rel="noopener">
        <img
          src="/src/assets/images/instagram-dusk-640.webp"
          width="640"
          height="853"
          alt="Ver no Instagram: aeronave ao entardecer"
          loading="lazy"
        />
      </a>
      <a class="instagram-grid__item" href="{{ instagramUrl }}" target="_blank" rel="noopener">
        <img
          src="/src/assets/images/instagram-hangar-640.webp"
          width="640"
          height="480"
          alt="Ver no Instagram: aeronave em frente ao hangar"
          loading="lazy"
        />
      </a>
      <a class="instagram-grid__item" href="{{ instagramUrl }}" target="_blank" rel="noopener">
        <img
          src="/src/assets/images/about-tail-sunset-640.webp"
          width="640"
          height="853"
          alt="Ver no Instagram: logomarca na deriva da aeronave"
          loading="lazy"
        />
      </a>
    </div>
  </div>
</section>
